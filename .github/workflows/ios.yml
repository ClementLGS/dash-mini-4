name: iPad (IPA non signé)

on:
  workflow_dispatch:
  push:
    branches: [test]
    paths:
      - 'ios/**'
      - 'index.html'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Tester la vérification de signature (vrais fichiers du dépôt)
        run: |
          swiftc -o /tmp/sigtest ios/TableauDeBord/Sources/Sig.swift ios/Tests/main.swift
          /tmp/sigtest version.json version.sig index.html

      - name: Copier l'interface (index.html de la branche)
        run: cp index.html ios/TableauDeBord/Resources/index.html

      - name: Générer le projet Xcode
        working-directory: ios
        run: xcodegen generate

      - name: Compiler (sans signature)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project TableauDeBord.xcodeproj -scheme TableauDeBord \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 40

      - name: Fabriquer l'IPA
        working-directory: ios
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name 'TableauDeBord.app' | head -1)
          echo "App : $APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry TableauDeBord-iPad-unsigned.ipa Payload
          ls -la TableauDeBord-iPad-unsigned.ipa
          plutil -p "$APP/Info.plist" | grep -E 'MinimumOSVersion|CFBundleIdentifier|UIDeviceFamily' || true

      - name: Erreurs de compilation (pour les voir dans les annotations)
        if: failure()
        working-directory: ios
        run: |
          [ -f build.log ] && grep -E "error:" build.log | sort -u | head -30 | while IFS= read -r l; do echo "::error::${l:0:450}"; done || true

      - uses: actions/upload-artifact@v4
        with:
          name: TableauDeBord-iPad-unsigned-ipa
          path: ios/TableauDeBord-iPad-unsigned.ipa
          if-no-files-found: error
